<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERA VPN PANEL</title>
    <style>
        /* Хакерлік/Киберпанк стильдегі қара дизайн */
        body {
            background-color: #0a0c10;
            color: #c9d1d9;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        h1 {
            color: #00ff66;
            text-shadow: 0 0 10px rgba(0, 255, 102, 0.3);
            margin-bottom: 5px;
        }
        .container {
            background-color: #12161f;
            border: 2px solid #00ff66;
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.2);
            border-radius: 12px;
            padding: 25px;
            margin: 20px auto;
            max-width: 400px;
            text-align: left;
        }
        .login-box {
            text-align: center;
        }
        input[type="text"], input[type="password"] {
            width: 85%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 6px;
            border: 1px solid #00ff66;
            background-color: #1a202c;
            color: #00ff66;
            font-size: 16px;
            text-align: center;
            outline: none;
        }
        .btn-action {
            background-color: #00ff66;
            color: #000;
            border: none;
            padding: 12px;
            width: 90%;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            transition: 0.3s;
        }
        .btn-action:hover {
            box-shadow: 0 0 15px #00ff66;
        }
        .menu-title {
            color: #00ff66;
            font-size: 22px;
            font-weight: bold;
            border-bottom: 2px solid #00ff66;
            padding-bottom: 10px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        /* VPN Батырмасының стилі */
        .vpn-section {
            text-align: center;
            margin-bottom: 25px;
        }
        .vpn-btn {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-color: #1a202c;
            border: 4px solid #ff3333;
            color: #ff3333;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 51, 51, 0.4);
            outline: none;
            transition: 0.4s;
        }
        .vpn-btn.connected {
            border-color: #00ff66;
            color: #00ff66;
            box-shadow: 0 0 25px rgba(0, 255, 102, 0.6);
            transform: scale(1.05);
        }
        .vpn-status {
            font-size: 18px;
            font-weight: bold;
            margin-top: 10px;
            color: #ff3333;
        }
        .vpn-status.connected {
            color: #00ff66;
        }

        /* Қосымша функциялар жиынтығы */
        .feature-box {
            border-top: 1px dashed #30363d;
            margin-top: 20px;
            padding-top: 15px;
            display: none; /* VPN қосылғанда ашылады */
        }
        .feature-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            font-size: 16px;
            color: #8b949e;
            transition: 0.3s;
        }
        .feature-item.active {
            color: #00ff66;
            font-weight: bold;
        }
        .status-badge {
            color: #ff3333;
            font-weight: bold;
        }
        .status-badge.active {
            color: #00ff66;
            text-shadow: 0 0 5px #00ff66;
        }
    </style>
</head>
<body>

    <h1>ERA VPN PANEL v1.0</h1>
    <p style="color: #8b949e;"># CYBER PROTECTION</p>

    <!-- 1. КІРУ БЕТІ (Аты: Ера, Пароль: 64) -->
    <div id="loginPage" class="container login-box">
        <div class="menu-title">AUTHENTICATION</div>
        <p>Жүйеге кіру үшін деректерді енгізіңіз:</p>
        <input type="text" id="usernameInput" placeholder="Аты (Логин)">
        <input type="password" id="passwordInput" placeholder="Пароль">
        <button class="btn-action" onclick="verifyLogin()">ENTER</button>
        <p id="loginError" style="color: #ff3333; margin-top: 10px; display: none;">ACCESS DENIED! Қате деректер.</p>
    </div>

    <!-- 2. НЕГІЗГІ VPN ПАНЕЛЬ БЕТІ -->
    <div id="mainPage" class="container" style="display: none;">
        <div class="menu-title"># ERA VPN SYSTEM</div>
        
        <!-- Ортадағы үлкен VPN батырмасы -->
        <div class="vpn-section">
            <button id="vpnButton" class="vpn-btn" onclick="toggleVPN()">OFF</button>
            <div id="vpnStatusText" class="vpn-status">VPN DISCONNECTED</div>
        </div>

        <!-- АВТОМАТТЫ ТҮРДЕ ҚОСЫЛАТЫН ЖАСЫРЫН ФУНКЦИЯЛАР -->
        <div id="hiddenFeatures" class="feature-box">
            <p style="color: #00ff66; font-size: 14px; text-align: center; margin-bottom: 10px;">[+] ҚОСЫМША ФУНКЦИЯЛАР БЕЛСЕНДІ</p>
            
            <div id="featAimbot" class="feature-item">
                <span>> AIMBOT TARGET: NECK</span>
                <span id="badgeAimbot" class="status-badge">OFF</span>
            </div>
            
            <div id="featEsp" class="feature-item">
                <span>> ESP SYSTEM PACKET INJECT</span>
                <span id="badgeEsp" class="status-badge">OFF</span>
            </div>
        </div>
    </div>

    <script>
        // Тексеру жүйесі (Аты: Ера, Пароль: 64)
        function verifyLogin() {
            const user = document.getElementById("usernameInput").value;
            const pass = document.getElementById("passwordInput").value;
            
            // Дәл сіз айтқандай "Ера" және "64"
            if (user === "Ера" && pass === "64") { 
                document.getElementById("loginPage").style.display = "none";
                document.getElementById("mainPage").style.display = "block";
            } else {
                document.getElementById("loginError").style.display = "block";
            }
        }

        // VPN қосу және функцияларды іске қосу логикасы
        function toggleVPN() {
            const btn = document.getElementById("vpnButton");
            const statusText = document.getElementById("vpnStatusText");
            const featureBox = document.getElementById("hiddenFeatures");
            
            const featAimbot = document.getElementById("featAimbot");
            const badgeAimbot = document.getElementById("badgeAimbot");
            const featEsp = document.getElementById("featEsp");
            const badgeEsp = document.getElementById("badgeEsp");

            if (!btn.classList.contains("connected")) {
                // VPN ҚОСУ
                btn.innerText = "WAIT";
                statusText.innerText = "CONNECTING...";
                
                // 1.5 секундтық жүктелу анимациясы (эффект үшін)
                setTimeout(() => {
                    btn.classList.add("connected");
                    btn.innerText = "ON";
                    statusText.innerText = "VPN CONNECTED SUCCESS";
                    statusText.classList.add("connected");

                    // Жасырын функциялар блогын шығару
                    featureBox.style.display = "block";
                    
                    // Функцияларды жасыл етіп жағу
                    featAimbot.classList.add("active");
                    badgeAimbot.innerText = "ACTIVE [x]";
                    badgeAimbot.classList.add("active");

                    featEsp.classList.add("active");
                    badgeEsp.innerText = "ACTIVE [x]";
                    badgeEsp.classList.add("active");
                }, 1500);

            } else {
                // VPN ӨШІРУ
                btn.classList.remove("connected");
                btn.innerText = "OFF";
                statusText.innerText = "VPN DISCONNECTED";
                statusText.classList.remove("connected");

                // Функцияларды толық жабу және өшіру
                featureBox.style.display = "none";
                
                featAimbot.classList.remove("active");
                badgeAimbot.innerText = "OFF";
                badgeAimbot.classList.remove("active");

                featEsp.classList.remove("active");
                badgeEsp.innerText = "OFF";
                badgeEsp.classList.remove("active");
            }
        }
    </script>
</body>
</html>
