<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERA PANEL v1.1</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        h1 {
            color: #58a6ff;
            margin-bottom: 5px;
        }
        .container {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 20px;
            margin: 20px auto;
            max-width: 400px;
            text-align: left;
        }
        .login-box {
            text-align: center;
        }
        input[type="text"], input[type="password"] {
            width: 80%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
            border: 1px solid #30363d;
            background-color: #21262d;
            color: white;
            font-size: 16px;
        }
        .menu-title {
            color: #58a6ff;
            font-size: 20px;
            font-weight: bold;
            border-bottom: 1px solid #30363d;
            padding-bottom: 10px;
            margin-bottom: 15px;
            text-align: center;
        }
        .feature-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            font-size: 16px;
        }
        .checkbox-rect {
            width: 20px;
            height: 20px;
            background-color: #21262d;
            border: 2px solid #30363d;
            border-radius: 4px;
            display: inline-block;
            text-align: center;
            line-height: 18px;
            color: #2ea44f;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-action {
            background-color: #2ea44f;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }
        .btn-action:hover {
            background-color: #2c974b;
        }
        .status-box {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 15px;
            margin: 20px auto;
            max-width: 400px;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>ERA PANEL v1.1</h1>
    <p style="color: #8b949e;"># ERA</p>

    <!-- 1. АТЫ МЕН ПАРОЛЬ ТЕКСЕРУ БЕТІ -->
    <div id="loginPage" class="container login-box">
        <div class="menu-title">ЖҮЙЕГЕ КІРУ</div>
        <p>Панельді ашу үшін деректерді енгізіңіз:</p>
        <input type="text" id="usernameInput" placeholder="Аты (Логин)">
        <input type="password" id="passwordInput" placeholder="Пароль">
        <button class="btn-action" onclick="verifyLogin()">КІРУ</button>
        <p id="loginError" style="color: #f85149; margin-top: 10px; display: none;">Аты немесе пароль қате!</p>
    </div>

    <!-- 2. НЕГІЗГІ МЕНЮ БЕТІ -->
    <div id="mainPage" class="container" style="display: none;">
        <div class="menu-title"># ERA MENU</div>
        
        <div class="feature-item">
            <span>BYPASS SECURE ACTIVE</span>
            <span class="checkbox-rect">[x]</span>
        </div>
        
        <div class="feature-item">
            <span>AIMBOT TARGET: NECK</span>
            <span class="checkbox-rect">[x]</span>
        </div>
        
        <div class="feature-item">
            <span>ESP SYSTEM PACKET INJECT</span>
            <span class="checkbox-rect">[x]</span>
        </div>
        
        <div class="feature-item">
            <span>ANTI-BAN 4-LAYER PROTECTION</span>
            <span class="checkbox-rect">[x]</span>
        </div>
        
        <button class="btn-action">INJECT TO HAPP</button>
    </div>

    <!-- АВТОМАТТЫ СТАТУС БӨЛІМІ -->
    <div class="status-box">
        <div id="panelStatus" style="font-weight: bold; font-size: 16px; color: #ffcc00; margin-bottom: 5px;">Жүктелуде...</div>
        <div id="appVersion" style="color: #8b949e;">Нұсқасы: 0.0.0</div>
    </div>

    <script>
       
        const jsonUrl = "https://github.com/Erasyl03/ERA_PANEL/edit/main/index.html";

        // Аты мен парольді тексеру функциясы (Аты: ERA, Пароль: 1964)
        function verifyLogin() {
            const user = document.getElementById("usernameInput").value;
            const pass = document.getElementById("passwordInput").value;
            
            if (user === "ERA" && pass === "1964") { 
                document.getElementById("loginPage").style.display = "none";
                document.getElementById("mainPage").style.display = "block";
            } else {
                document.getElementById("loginError").style.display = "block";
            }
        }

        async function loadPanelData() {
            try {
                const response = await fetch(jsonUrl);
                const data = await response.json();
                
                console.log("JSON деректері сәтті оқылды:", data);
                
                document.getElementById("panelStatus").innerText = "Панель күйі: " + data.panel_status;
                document.getElementById("appVersion").innerText = "Нұсқасы: " + data.app_version;
                
                if (data.panel_status === "active") {
                    document.getElementById("panelStatus").style.color = "#2ea44f";
                }
                
                if (window.Android && window.Android.sendDataToApp) {
                    window.Android.sendDataToApp(JSON.stringify(data));
                }
                
            } catch (error) {
                console.error("JSON оқылмады:", error);
                document.getElementById("panelStatus").innerText = "Қате: JSON оқылмады";
                document.getElementById("panelStatus").style.color = "#f85149";
            }
        }

        window.onload = loadPanelData;
    </script>
</body>
</html>
