<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERA VIP PANEL v2.0</title>
    <style>
        body { background-color: #0f172a; color: white; font-family: sans-serif; text-align: center; padding: 20px; }
        .btn { display: block; width: 80%; max-width: 300px; margin: 15px auto; padding: 15px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; }
        .btn-vpn { background-color: #3b82f6; color: white; }
        .btn-fun { background-color: #10b981; color: white; }
        .btn-inject { background-color: #ef4444; color: white; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.03); } 100% { transform: scale(1); } }
        .status { margin-top: 20px; color: #94a3b8; font-size: 14px; }
    </style>
</head>
<body>
    <h2>ERA VIP PANEL (JSON INJECTOR)</h2>
    <p>No-Root & Виртуалкасыз Схема</p>

    <button class="btn btn-vpn" onclick="toggleVPN()">1. VPN ҚОСУ (Anti-Cheat Bypass)</button>
    <button class="btn btn-fun" onclick="enableFunctions()">2. ФУНКЦИЯЛАРДЫ ТАҢДАУ (Aim + ESP)</button>
    <button class="btn btn-inject" onclick="injectJson()">3. HAPP-ҚА ЛАҚТЫРУ (Inject JSON)</button>

    <div class="status" id="statusLog">Күйі: Күтуде...</div>

    <script>
        let vpnActive = false;
        let funActive = false;

        function toggleVPN() {
            vpnActive = true;
            document.getElementById('statusLog').innerText = "Күйі: 4 деңгейлі Античит бұғатталды! Жапония VPN белсенді.";
            document.getElementById('statusLog').style.color = "#3b82f6";
        }

        function enableFunctions() {
            if(!vpnActive) { alert("Алдымен VPN қосыңыз!"); return; }
            funActive = true;
            document.getElementById('statusLog').innerText = "Күйі: Aimbot Neck және ESP Lines таңдалды!";
            document.getElementById('statusLog').style.color = "#10b981";
        }

        function injectJson() {
            if(!funActive) { alert("Алдымен функцияларды таңдаңыз!"); return; }
            document.getElementById('statusLog').innerText = "Күйі: JSON файлы Happ (HttpCanary) бағдарламасына сәтті лақтырылды!";
            document.getElementById('statusLog').style.color = "#ef4444";
            
            // HttpCanary-ге файлды автоматты түрде жүктеуге жіберу (API арқылы лақтыру)
            window.location.href = "intent://download?url=https://yourdomain.com";
        }
    </script>
</body>
</html>
